<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MedQuiz — Tibbiyot imtihonlari</title>
    <meta name="description" content="MedQuiz — tibbiyot imtihon mashqi. O‘z savollaringizni yuklang." />
    <meta name="theme-color" content="#f8fafc" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet" />
    <script src="https://cdn.lordicon.com/lordicon.js"></script>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('medquiz-v2-theme');
          if (!t) {
            t = 'light';
          }
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          }
          document.documentElement.setAttribute('data-theme', t);

          var fs = localStorage.getItem('medquiz-font-size');
          if (fs === 'large') document.documentElement.style.fontSize = '17px';
          else if (fs === 'huge') document.documentElement.style.fontSize = '19px';
          else if (fs === 'normal') document.documentElement.style.fontSize = '15px';

          var c = localStorage.getItem('medquiz-contrast');
          if (c === 'high') document.documentElement.classList.add('high-contrast');
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
